name: Version 5 release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check and configure the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current_type=$(gh api "repos/$GH_REPO/pages" --jq .build_type)
          if [ "$current_type" = "workflow" ]; then exit 0; fi
          printf '%s\n' '{"build_type":"workflow"}' > "$RUNNER_TEMP/pages-source.json"
          if ! gh api --method PUT "repos/$GH_REPO/pages" --input "$RUNNER_TEMP/pages-source.json" --silent 2> "$RUNNER_TEMP/pages-error.txt"; then
            pages_error_text=$(cat "$RUNNER_TEMP/pages-error.txt")
            printf '::error title=Pages source configuration::%s\n' "$pages_error_text"
            exit 1
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-browser-results
          path: test-results/
  stage:
    needs: [verify, configure]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live release commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-published.mjs "$PAGES_URL" "$GITHUB_SHA"
