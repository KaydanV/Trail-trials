name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:valley
      - run: npm test
      - run: npm run test:valley
      - run: npx playwright install --with-deps chromium
      - name: Complete the foundation in a browser
        run: |
          npm start > /tmp/terminal-trails-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:mobile
          npm run test:valley:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-results
          path: test-results/
